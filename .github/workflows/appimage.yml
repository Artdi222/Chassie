name: AppImage
# A release tag (v*) builds the AppImage and attaches it to the GitHub release of that tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:  # Build only (checks the build; nothing is kept).
permissions:
  contents: write
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Host libraries for the import check (the AppImage uses the desktop's own, like any Qt app)
        run: sudo apt-get update -q && sudo apt-get install -yq libportaudio2 libegl1 libgl1 libxkbcommon-x11-0 libnss3
      - run: scripts/build_appimage.sh
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag
          gh release upload "$GITHUB_REF_NAME" dist/*.AppImage --clobber
